# fly.toml app configuration file generated for anniexboda-aq1hya on 2026-11-26T04:14:58Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'anniexboda-aq1hya'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUDIO_QUALITY = 'MASTER'
  CALL_CHAT_ANNOUNCE = 'False'
  ENABLE_PASSTHROUGH = 'True'
  IP_VERSION = '4'
  MKL_NUM_THREADS = '4'
  NUMEXPR_NUM_THREADS = '4'
  OMP_NUM_THREADS = '4'
  PYTHONDONTWRITEBYTECODE = '1'
  PYTHONUNBUFFERED = '1'
  TMPDIR = '/dev/shm'
  VIDEO_QUALITY = 'FHD_1080p'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 2048

[[vm]]
  cpu_kind = 'performance'
  cpus = 8
  memory_mb = 20480
  memory = '20gb'
  processes = ['app']
  size = 'performance-8x'
